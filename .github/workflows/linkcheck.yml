name: linkcheck
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source URLs
        run: python3 -c "import json;print('\n'.join(sorted({r['source_url'] for r in json.load(open('data/recipes.json'))}|{s['url'] for s in json.load(open('data/sources.json'))['sources']})))" > urls.txt
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # x.com blocks anonymous fetches; accept 403/429 there instead of reporting false positives
          args: --no-progress --max-concurrency 4 --accept 200..=299,403,429 --exclude-mail urls.txt docs/*.md recipes/*.md
          fail: false
          output: lychee/out.md
      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken source links (weekly link check)
          content-filepath: lychee/out.md
          labels: links
