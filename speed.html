function frame(now){
  const e=(now-t0)/1000;let alive=false;
  for(const L of lanes){const n=TOKS.length;let add='';
    while(L.i<n&&L.ts[L.i]<=e){add+=TOKS[L.i];L.i++}
    if(add){L.o.querySelector('.pf')?.remove();L.txt.appendData(add);L.o.scrollTop=L.o.scrollHeight}
    if(L.i<n)alive=true;else if(L.end===null){L.end=L.ts[n-1];L.o.querySelector('.cur')?.remove()}
    L.el.querySelector('.pg i').style.width=(L.i/n*100)+'%';
    L.el.querySelector('.cnt').textContent=`${L.i} / ${n} ${T.tok}`;
    L.el.querySelector('.tm').textContent=L.end!==null?`${T.done} ${L.end.toFixed(1)} s`:`${e.toFixed(1)} s`}
  $('rb').style.width=Math.min(100,e*READ/TOKS.length*100)+'%';$('ab').style.width=Math.min(100,e*ALOUD/TOKS.length*100)+'%';
  if(EMBED&&e>=LOOP){start();return}
  if(alive||e*ALOUD<TOKS.length)raf=requestAnimationFrame(frame)}
function chart(){
  const W=900,H=330,L0=56,R0=W-16,T0=14,B0=H-84,N=500,X=r=>L0+(R0-L0)*Math.log(r/SMIN)/Math.log(SMAX/SMIN),YM=150,Y=s=>B0-(B0-T0)*Math.min(s,YM)/YM;
  let s='';
  for(const v of [1,2,5,10,20,50,100,200,500,1000,2000])s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T0}" y2="${B0}" class="gl"/><text x="${X(v)}" y="${B0+14}" text-anchor="middle">${v}</text>`;
  for(const v of [0,30,60,90,120,150])s+=`<line x1="${L0}" x2="${R0}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L0-6}" y="${Y(v)+4}" text-anchor="end">${v}s</text>`;
  let d='';for(let i=0;i<=200;i++){const r=SMIN*Math.pow(SMAX/SMIN,i/200);d+=(i?'L':'M')+X(r).toFixed(1)+','+Y(N/r).toFixed(1)}
  s+=`<path d="${d}" fill="none" class="cv" stroke-width="2.5"/>`;
  for(const [v,lab,dash] of [[READ,'silent',''],[ALOUD,'aloud','4 3']]){const y=Y(N/v);s+=`<line x1="${L0}" x2="${R0}" y1="${y}" y2="${y}" class="rd" stroke-dasharray="${dash}"/><text x="${R0-4}" y="${y-4}" text-anchor="end">${lab}: ${Math.round(N/v)} s @ ${v.toFixed(1)} tok/s</text>`}
  for(const r of RATES)s+=`<circle cx="${X(r)}" cy="${Y(N/r)}" r="4" class="rp"/><text x="${X(r)+6}" y="${Y(N/r)-6}">${(N/r).toFixed(r>=100?1:0)}s</text>`;
  for(const x of RECIPES)s+=`<circle cx="${X(x.tok_s)}" cy="${B0+30+((x.id.charCodeAt(x.id.length-1)%5)*3)}" r="2.5" class="lo" opacity=".55"><title>${esc(hwShort(x.hardware))} · ${esc(x.model)} · ${esc(x.tok_s)} tok/s</title></circle>`;
  s+=`<text x="${L0}" y="${B0+74}" class="lo">● local measured (n=${RECIPES.length})</text>`;
  for(const c of REF.cloud.items){const x=X(c.tps*Q2O);s+=`<line x1="${x}" x2="${x}" y1="${T0}" y2="${T0+10}" class="cl" stroke-width="2"><title>${esc(c.label)} (${esc(c.variant)}) ${esc(c.tps)} o200k tok/s</title></line>`}
  s+=`<text x="${R0}" y="${B0+74}" text-anchor="end" class="cl">▮ cloud API median (top ticks)</text><text x="${(L0+R0)/2}" y="${B0+74}" text-anchor="middle">tok/s (log)</text>`;
  $('chart').innerHTML=s}
function method(){
  const st=ST[LANG],rd=REF.reading[LANG],u=st.unit==='word'?'word':'char';
  const li=[];
  li.push(`Tokenizer: Qwen/Qwen3-8B. Sample (${LANG}): ${st.tokens} tokens / ${st.units} ${u}s = <b>${st.tok_per_unit}</b> tokens per ${u} (measured, scripts/gen_speed_tokens.py).`);
  for(const k of ['silent','aloud']){const x=rd[k];li.push(`${k}: ${esc(x.rate)} ${esc(x.unit)} × ${st.tok_per_unit} / 60 = <b>${(x.rate*st.tok_per_unit/60).toFixed(2)} tok/s</b> — ${esc(x.what)}. <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.src)}</a>`)}
  li.push(`Cloud: ${esc(REF.cloud.note)} Converted to Qwen3 tokens with this text's ratio ${st.tokens}/${st.o200k_tokens} (o200k). <a href="${esc(REF.cloud.method_url)}" target="_blank" rel="noopener">AA methodology</a> · `+REF.cloud.items.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.label)}</a> ${esc(c.tps)}`).join(', '));
  li.push(`Prefill / TTFT: ${esc(REF.prefill.note)} `+REF.prefill.items.map(p=>`${esc(p.id)} ${esc(p.label)} ${esc(p.pp)}`).join(' · ')+`. Check: x-001 reports TTFT 11.8 s for an 8K prompt at 699 tok/s; 8192/699 = 11.7 s.`);
  li.push(`Decode model: ${esc(REF.mtp.note)} Step times are lognormal (σ = 0.35, illustrative — no public inter-token-latency distribution in our data) and rescaled so the mean rate is exact. Timing uses requestAnimationFrame against elapsed time, so lanes never drift.`);
  li.push(`Lanes 5-10-20-50-100-200-500 follow the 1-2-5 preferred-number series (steps of 2–2.5×). Perceived magnitude grows roughly with the logarithm of the stimulus (Weber–Fechner), so equal ratios read as equal steps; 10/30/50 would put two lanes only 1.7× apart and leave 50→500 empty, where cloud APIs (≈80–140) and fast providers (≈300–1,700) sit.`);
  $('method').innerHTML=li.map(x=>`<li>${x}</li>`).join('')}
$('go').onclick=start;$('stop').onclick=()=>cancelAnimationFrame(raf);
$('cr').oninput=label;$('pl').onchange=label;$('pp').onchange=label;
$('go').textContent=T.go;$('stop').textContent=T.stop;
Promise.all([fetch('data/speed-tokens.json').then(r=>r.json()),fetch('data/speed-refs.json').then(r=>r.json()),fetch('data/recipes.json').then(r=>r.json()).catch(()=>[])]).then(([tk,rf,rc])=>{
  TOKS=tk.texts[LANG]||tk.texts.en;ST=tk.stats;REF=rf;const st=ST[LANG];
  Q2O=st.tokens/st.o200k_tokens;
  const rd=REF.reading[LANG],cv=x=>x.rate*st.tok_per_unit/60;READ=cv(rd.silent);ALOUD=cv(rd.aloud);
  const tag=x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${x.estimate?T.est+' · ':''}${esc(x.rate)} ${esc(x.unit)}</a>`;
  $('rlab').innerHTML=T.silent(READ.toFixed(1),tag(rd.silent));$('alab').innerHTML=T.aloud(ALOUD.toFixed(1),tag(rd.aloud));
  $('pp').innerHTML=REF.prefill.items.map(p=>`<option value="${esc(p.pp)}"${p.id==='x-005'?' selected':''}>${esc(p.label)} · ${esc(p.pp)} tok/s</option>`).join('');
  RECIPES=rc.filter(r=>r.category==='text'&&r.tok_s&&r.source_level==='实测');
  $('cr').value=r2sl(35);
  build();chart();method();if(P.has('autostart')||EMBED)start();
});
