const P=new URLSearchParams(location.search);
const NL=(navigator.language||'').toLowerCase(); let SAVED=null; try{SAVED=localStorage.getItem('lang')}catch(e){}
let LANG=P.get('lang')||(P.has('embed')?null:SAVED)||(NL.startsWith('ja')?'ja':NL.startsWith('zh')?'zh-CN':'en');
if(['en','zh-CN'].includes(P.get('lang'))&&!P.has('embed'))try{localStorage.setItem('lang',P.get('lang'))}catch(e){}  // only values the other pages understand  // shared with the other pages (i18n.js)
if(!I18N[LANG])LANG='en'; const T=I18N[LANG]; document.documentElement.lang=LANG;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[e.dataset.t]);
document.querySelectorAll('[data-l]').forEach(e=>e.classList.toggle('on',e.dataset.l===LANG));
document.querySelectorAll('#dm option').forEach(o=>o.textContent=T[o.value]);
const EMBED=P.has('embed'); if(EMBED)document.body.classList.add('embed');
// 1-2-5 series: ~0.3-0.4 decade steps, equal perceptual spacing (Weber-Fechner)
const RATES=EMBED?[10,20,50,100,200,500]:[5,10,20,50,100,200,500]; const LOOP=+(P.get('loop')||8);
const SMIN=1,SMAX=2000; const sl2r=v=>Math.round(SMIN*Math.pow(SMAX/SMIN,v/1000)); const r2sl=r=>Math.round(1000*Math.log(r/SMIN)/Math.log(SMAX/SMIN));
let TOKS=[],ST=null,REF=null,RECIPES=[],lanes=[],raf=0,t0=0,READ=5,ALOUD=4,Q2O=1;
const $=id=>document.getElementById(id);
const f1=x=>x>=100?Math.round(x):x>=10?x.toFixed(0):x.toFixed(1);
function badge(r){return r<ALOUD?0:r<=READ*1.5?1:r<250?2:3}
function closest(r){let best=null;for(const x of RECIPES){const d=Math.abs(Math.log(x.tok_s/r));if(d<=Math.log(1.12)&&(!best||d<best.d))best={d,x}}return best&&best.x}
function cloudNear(r){let best=null;for(const c of REF.cloud.items){const q=c.tps*Q2O,d=Math.abs(Math.log(q/r));if(d<=Math.log(1.2)&&(!best||d<best.d))best={d,c,q}}return best}
function hwShort(s){return s.replace(/[（(][^）)]*[）)]/g,'').replace(/[\u4e00-\u9fff，、；：]+/g,' ').replace(/\s+/g,' ').trim()}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function ttft(){const p=+$('pl').value,pp=+$('pp').value;return p&&pp?p/pp:0}
// per-token emission times (s). Steps = verify passes; MTP: 1 + accepted drafts (depth d, acceptance a).
// Step durations ~ lognormal(sigma .35) then rescaled so n tokens take exactly n/rate s after the first token.
function times(rate){
  const n=TOKS.length,m=$('dm').value,steps=[];let c=0;
  while(c<n){let k=1;if(m==='mtp'){for(let j=0;j<REF.mtp.depth&&Math.random()<REF.mtp.accept;j++)k++}k=Math.min(k,n-c);steps.push(k);c+=k}
  const w=steps.map(()=>m==='steady'?1:Math.exp(.35*gauss()));const W=w.reduce((a,b)=>a+b,0)-w[0]+1e-9;
  const D=(n-1)/rate,out=[];let t=ttft();
  steps.forEach((k,i)=>{if(i>0)t+=w[i]/W*D;for(let j=0;j<k;j++)out.push(t)});return out}
function build(){
  $('lanes').innerHTML='';lanes=[];
  for(const r of EMBED?RATES:[...RATES,'c']){
    const el=document.createElement('div');el.className='lane';
    el.innerHTML=`<div class="lh"><b><span class="rv"></span> <small>tok/s</small></b><span class="badge"></span></div><div class="real"></div><div class="cloud"></div><div class="out"></div><div class="pg"><i></i></div><div class="meta"><span class="cnt"></span><span class="tm"></span></div>`;
    $('lanes').appendChild(el);lanes.push({el,r})}
  label()}
const rateOf=L=>L.r==='c'?sl2r(+$('cr').value):L.r;
function label(){$('cv').textContent=sl2r(+$('cr').value);
  const tt=ttft();$('ttftv').textContent=tt?T.ttft(+$('pl').value,+$('pp').value,tt.toFixed(1)):'';
  for(const L of lanes){const r=rateOf(L),b=badge(r),q=L.el.querySelector('.badge');
  L.el.querySelector('.rv').textContent=r;q.className='badge b'+b;q.textContent=T.b[b];
  const x=closest(r);L.el.querySelector('.real').innerHTML=x?`${T.real} <a href="${x.source_url}" target="_blank" rel="noopener">${hwShort(x.hardware)} · ${x.model} · ${x.tok_s}</a>`:'';
  const c=cloudNear(r);L.el.querySelector('.cloud').innerHTML=c?`${T.cloud} <a href="${c.c.url}" target="_blank" rel="noopener">${c.c.label}${c.c.variant==="provider"||EMBED?"":" ("+c.c.variant+")"} ≈ ${f1(c.q)}</a>`:'';
  L.el.querySelector('.cnt').textContent=`0 / ${TOKS.length} ${T.tok}`}}
function start(){
  cancelAnimationFrame(raf);label();
  for(const L of lanes){L.ts=times(rateOf(L));L.i=0;L.o=L.el.querySelector('.out');L.o.innerHTML=(L.ts[0]>0?`<span class="pf">${T.pf}</span>`:'')+'<span class="cur"></span>';L.txt=document.createTextNode('');L.o.insertBefore(L.txt,L.o.querySelector('.cur'));L.end=null}
  t0=performance.now();$('go').textContent=T.again;raf=requestAnimationFrame(frame)}
function frame(now){
  const e=(now-t0)/1000;let alive=false;
  for(const L of lanes){const n=TOKS.length;let add='';
    while(L.i<n&&L.ts[L.i]<=e){add+=TOKS[L.i];L.i++}
    if(add){L.o.querySelector('.pf')?.remove();L.txt.appendData(add);L.o.scrollTop=L.o.scrollHeight}
    if(L.i<n)alive=true;else if(L.end===null){L.end=L.ts[n-1];L.o.querySelector('.cur')?.remove()}
    L.el.querySelector('.pg i').style.width=(L.i/n*100)+'%';
    L.el.querySelector('.cnt').textContent=`${L.i} / ${n} ${T.tok}`;
    L.el.querySelector('.tm').textContent=L.end!==null?`${T.done} ${L.end.toFixed(1)} s`:`${e.toFixed(1)} s`}
  $('rb').style.width=Math.min(100,e*READ/TOKS.length*100)+'%';$('ab').style.width=Math.min(100,e*ALOUD/TOKS.length*100)+'%';
  if(EMBED&&e>=LOOP){start();return}
  if(alive||e*ALOUD<TOKS.length)raf=requestAnimationFrame(frame)}
function chart(){
  const W=900,H=330,L0=56,R0=W-16,T0=14,B0=H-84,N=500,X=r=>L0+(R0-L0)*Math.log(r/SMIN)/Math.log(SMAX/SMIN),YM=150,Y=s=>B0-(B0-T0)*Math.min(s,YM)/YM;
  let s='';
  for(const v of [1,2,5,10,20,50,100,200,500,1000,2000])s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T0}" y2="${B0}" stroke="#eef0f5"/><text x="${X(v)}" y="${B0+14}" text-anchor="middle">${v}</text>`;
  for(const v of [0,30,60,90,120,150])s+=`<line x1="${L0}" x2="${R0}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef0f5"/><text x="${L0-6}" y="${Y(v)+4}" text-anchor="end">${v}s</text>`;
  let d='';for(let i=0;i<=200;i++){const r=SMIN*Math.pow(SMAX/SMIN,i/200);d+=(i?'L':'M')+X(r).toFixed(1)+','+Y(N/r).toFixed(1)}
  s+=`<path d="${d}" fill="none" stroke="#4f46e5" stroke-width="2.5"/>`;
  for(const [v,lab,dash] of [[READ,'silent',''],[ALOUD,'aloud','4 3']]){const y=Y(N/v);s+=`<line x1="${L0}" x2="${R0}" y1="${y}" y2="${y}" stroke="#94a3b8" stroke-dasharray="${dash}"/><text x="${R0-4}" y="${y-4}" text-anchor="end">${lab}: ${Math.round(N/v)} s @ ${v.toFixed(1)} tok/s</text>`}
  for(const r of RATES)s+=`<circle cx="${X(r)}" cy="${Y(N/r)}" r="4" fill="#4f46e5"/><text x="${X(r)+6}" y="${Y(N/r)-6}">${(N/r).toFixed(r>=100?1:0)}s</text>`;
  for(const x of RECIPES)s+=`<circle cx="${X(x.tok_s)}" cy="${B0+30+((x.id.charCodeAt(x.id.length-1)%5)*3)}" r="2.5" fill="#22c55e" opacity=".55"><title>${hwShort(x.hardware)} · ${x.model} · ${x.tok_s} tok/s</title></circle>`;
  s+=`<text x="${L0}" y="${B0+74}" fill="#16a34a">● local measured (n=${RECIPES.length})</text>`;
  for(const c of REF.cloud.items){const x=X(c.tps*Q2O);s+=`<line x1="${x}" x2="${x}" y1="${T0}" y2="${T0+10}" stroke="#0e7490" stroke-width="2"><title>${c.label} (${c.variant}) ${c.tps} o200k tok/s</title></line>`}
  s+=`<text x="${R0}" y="${B0+74}" text-anchor="end" fill="#0e7490">▮ cloud API median (top ticks)</text><text x="${(L0+R0)/2}" y="${B0+74}" text-anchor="middle">tok/s (log)</text>`;
  $('chart').innerHTML=s}
function method(){
  const st=ST[LANG],rd=REF.reading[LANG],u=st.unit==='word'?'word':'char';
  const li=[];
  li.push(`Tokenizer: Qwen/Qwen3-8B. Sample (${LANG}): ${st.tokens} tokens / ${st.units} ${u}s = <b>${st.tok_per_unit}</b> tokens per ${u} (measured, scripts/gen_speed_tokens.py).`);
  for(const k of ['silent','aloud']){const x=rd[k];li.push(`${k}: ${x.rate} ${x.unit} × ${st.tok_per_unit} / 60 = <b>${(x.rate*st.tok_per_unit/60).toFixed(2)} tok/s</b> — ${x.what}. <a href="${x.url}" target="_blank" rel="noopener">${x.src}</a>`)}
  li.push(`Cloud: ${REF.cloud.note} Converted to Qwen3 tokens with this text's ratio ${st.tokens}/${st.o200k_tokens} (o200k). <a href="${REF.cloud.method_url}" target="_blank" rel="noopener">AA methodology</a> · `+REF.cloud.items.map(c=>`<a href="${c.url}" target="_blank" rel="noopener">${c.label}</a> ${c.tps}`).join(', '));
